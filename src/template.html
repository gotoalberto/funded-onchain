<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>onchain.cc Funded flows</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>/* funded.onchain.cc mockup kit.
   Tokens copied from onchain-trenches packages/ui/src/styles/theme.css (oklch converted to hex)
   and apps/web/app/globals.css glass utilities. Dark only, like onchain.cc. */

:root {
  color-scheme: dark;

  /* surfaces */
  --bg: #000;
  --background: #0b0b0b;
  --surface: #161616;
  --surface-2: #1d1d1d;
  --surface-3: #262626;
  --border: #262626;
  --border-strong: #808080;

  /* text */
  --text: #ffffff;
  --text-2: #e8e8e8;
  --text-3: #c7c7c7;
  --muted: #868686;
  --label: #999999;
  --disabled: #696969;

  /* brand */
  --primary: #9095fd;
  --primary-hover: #7d7ff3;
  --primary-active: #6e6bed;
  --primary-subtle: #acb3ff;
  --primary-15: rgb(144 149 253 / 0.15);
  --primary-35: rgb(144 149 253 / 0.35);

  /* semantic */
  --buy: #00a566;
  --buy-light: #00b272;
  --buy-20: rgb(0 165 102 / 0.2);
  --sell: #d73337;
  --sell-20: rgb(215 51 55 / 0.2);
  --sell-cta: #ff7243;
  --error: #d23f18;
  --error-light: #e14d28;
  --warning: #dfb100;
  --warning-strong: #f1cb1c;
  --warning-20: rgb(223 177 0 / 0.16);
  --info: #19affe;
  --gold: #e8b10c;
  --silver: #c0c0c8;
  --bronze: #cd7f32;

  /* glass */
  --glass: rgb(255 255 255 / 0.08);
  --glass-subtle: rgb(255 255 255 / 0.04);
  --glass-hover: rgb(255 255 255 / 0.14);
  --glass-edge: rgb(255 255 255 / 0.08);
  --glass-glow: rgb(255 255 255 / 0.16);
  --glass-sep: rgb(255 255 255 / 0.1);
  --rim: inset 0 1px 0 0 var(--glass-glow), inset -1px 0 0 0 var(--glass-edge), inset 0 -1px 0 0 var(--glass-edge), inset 1px 0 0 0 var(--glass-edge);

  /* type */
  --font: "Google Sans Flex", "Be Vietnam Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

  /* radius */
  --r-xs: 4px; --r-sm: 6px; --r-md: 8px; --r-lg: 12px; --r-xl: 16px; --r-2xl: 20px; --r-full: 9999px;

  /* motion */
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  --fast: 150ms;
  --normal: 200ms;

  --shadow-pop: 0 8px 40px rgb(0 0 0 / 0.35), inset 0 0 0 1px var(--glass-edge), inset 0 1px 0 0 var(--glass-glow);
}

/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: var(--font);
  font-size: 14px;
  line-height: 20px;
  color: var(--text);
  background:
    radial-gradient(circle at 0% 0%, rgb(133 82 251 / 0.1) 0%, rgb(51 51 51 / 0) 35%),
    radial-gradient(circle at 50% 50%, rgb(13 13 13 / 0) 70%, rgb(0 0 0 / 0.85) 100%),
    #000;
  background-attachment: fixed;
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "tnum" 1;
}
::selection { background: var(--primary-35); color: #fff; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
input, select { font: inherit; color: inherit; }
img, svg { display: block; }
h1, h2, h3, h4, p { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #3d3d3d; }
::-webkit-scrollbar-track { background: transparent; }
:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--background), 0 0 0 4px var(--primary-subtle); border-radius: var(--r-sm); }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: 0.92em; letter-spacing: 0; }
.up { color: var(--buy); }
.down { color: var(--sell); }
.muted { color: var(--muted); }
.label { color: var(--label); font-size: 12px; line-height: 16px; }
.dim { color: var(--text-3); }
.warn { color: var(--warning); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.ico { width: 16px; height: 16px; flex: none; stroke-width: 1.75; }
.ico-sm { width: 14px; height: 14px; }
.ico-lg { width: 20px; height: 20px; }

/* type scale (product UI, 1.2 ratio) */
.t-display { font-size: 48px; line-height: 52px; font-weight: 600; letter-spacing: -0.03em; }
.t-title { font-size: 32px; line-height: 38px; font-weight: 600; letter-spacing: -0.02em; }
.t-heading { font-size: 22px; line-height: 28px; font-weight: 600; letter-spacing: -0.01em; }
.t-sub { font-size: 17px; line-height: 24px; font-weight: 600; }
.t-body { font-size: 14px; line-height: 20px; }
.t-small { font-size: 13px; line-height: 18px; }
.t-caption { font-size: 12px; line-height: 16px; }
.t-micro { font-size: 11px; line-height: 14px; }
.t-figure { font-size: 40px; line-height: 44px; font-weight: 600; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.t-figure-sm { font-size: 26px; line-height: 30px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.w5 { font-weight: 500; } .w6 { font-weight: 600; } .w7 { font-weight: 700; }

/* ---------- layout ---------- */
.page { max-width: 1440px; margin: 0 auto; padding: 8px 16px 96px; }
.page-narrow { max-width: 1120px; margin: 0 auto; padding: 24px 24px 120px; }
.row { display: flex; align-items: center; gap: 8px; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.stack { display: flex; flex-direction: column; }
.gap-2 { gap: 4px; } .gap-3 { gap: 8px; } .gap-4 { gap: 12px; } .gap-5 { gap: 16px; } .gap-6 { gap: 24px; } .gap-7 { gap: 32px; } .gap-8 { gap: 48px; }
.grow { flex: 1; min-width: 0; }
.grid { display: grid; gap: 8px; }
.mt-2 { margin-top: 4px; } .mt-3 { margin-top: 8px; } .mt-4 { margin-top: 12px; } .mt-5 { margin-top: 16px; } .mt-6 { margin-top: 24px; } .mt-7 { margin-top: 32px; } .mt-8 { margin-top: 48px; }
.divider { height: 1px; background: var(--glass-sep); border: 0; margin: 0; }

/* ---------- header ---------- */
.app-header {
  position: sticky; top: 0; z-index: 30;
  height: 56px; padding: 0 16px;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  background: rgb(10 10 10 / 0.55);
  backdrop-filter: blur(32px) saturate(180%);
  -webkit-backdrop-filter: blur(32px) saturate(180%);
  border-bottom: 1px solid var(--glass-sep);
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand img { height: 15px; width: auto; }
.brand-tag {
  font-size: 12px; line-height: 20px; font-weight: 600; color: var(--primary);
  padding: 0 8px; border-radius: var(--r-full);
  background: var(--primary-15); box-shadow: inset 0 1px 0 0 rgb(255 255 255 / 0.12);
}
.nav-track {
  display: flex; align-items: center; gap: 2px; height: 36px; padding: 4px;
  border-radius: var(--r-full);
  background: rgb(30 30 30 / 0.45);
  box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.08);
}
.nav-item {
  height: 28px; padding: 0 12px; display: inline-flex; align-items: center; gap: 6px;
  border-radius: var(--r-full); font-size: 13px; font-weight: 500; color: var(--muted);
  transition: color var(--fast) ease, background-color var(--fast) ease;
}
.nav-item:hover { color: var(--text-2); }
.nav-item[aria-current="page"] {
  color: #fff; font-weight: 600;
  background-color: rgb(255 255 255 / 0.05);
  background-image: linear-gradient(180deg, rgb(255 255 255 / 0.14) 0%, rgb(255 255 255 / 0.05) 48%, rgb(255 255 255 / 0) 100%);
  box-shadow: inset 0 1px 0 0 rgb(255 255 255 / 0.24), inset 0 0 0 1px rgb(255 255 255 / 0.1);
}
.nav-item[aria-current="page"] .ico { color: var(--primary); }
.header-right { display: flex; align-items: center; gap: 8px; }
.icon-btn {
  width: 32px; height: 32px; display: inline-grid; place-items: center; border-radius: var(--r-full);
  color: var(--text-3); position: relative;
  transition: background-color var(--fast) ease, transform 160ms var(--ease-out);
}
.icon-btn:hover { background: rgb(255 255 255 / 0.06); color: #fff; }
.icon-btn:active { transform: scale(0.95); }
.icon-btn .badge-dot { position: absolute; top: 6px; right: 7px; width: 6px; height: 6px; border-radius: 50%; background: var(--primary); box-shadow: 0 0 0 2px #0b0b0b; }
.chip {
  height: 32px; padding: 0 12px; display: inline-flex; align-items: center; gap: 8px;
  border-radius: var(--r-full); font-size: 13px; font-weight: 500; white-space: nowrap;
  background: var(--glass); box-shadow: inset 0 1px 0 0 var(--glass-glow);
  transition: background-color var(--fast) ease;
}
a.chip:hover, button.chip:hover { background: var(--glass-hover); }
.chip .k { color: var(--muted); font-weight: 500; }
.avatar {
  width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
  font-size: 12px; font-weight: 700; color: #0a0a0d;
  background: conic-gradient(from 200deg, #9095fd, #acb3ff, #6e6bed, #9095fd);
}
.season-chip .bar { width: 40px; height: 4px; border-radius: 4px; background: rgb(255 255 255 / 0.1); overflow: hidden; }
.season-chip .bar i { display: block; height: 100%; background: #cfcfd4; border-radius: inherit; }

/* account switch chip */
.acct {
  height: 32px; display: inline-flex; align-items: center; gap: 8px; padding: 0 10px 0 6px;
  border-radius: var(--r-full); background: var(--glass); box-shadow: inset 0 1px 0 0 var(--glass-glow);
  font-size: 13px; white-space: nowrap;
}
.acct-tag { height: 22px; padding: 0 8px; border-radius: var(--r-full); font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; letter-spacing: 0.02em; }
.acct-tag.own { background: rgb(255 255 255 / 0.08); color: var(--text-3); }
.acct-tag.funded { background: rgb(232 177 12 / 0.14); color: #e8c078; }
.acct-tag.paused { background: var(--warning-20); color: var(--warning-strong); }
.acct-tag.frozen { background: rgb(25 175 254 / 0.16); color: var(--info); }
.acct-tag.closed { background: var(--sell-20); color: #ff6b6e; }

/* ---------- buttons ---------- */
.btn {
  height: 36px; padding: 0 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border-radius: var(--r-full); font-size: 13px; font-weight: 600; white-space: nowrap;
  transition: background-color var(--fast) ease, color var(--fast) ease, transform 160ms var(--ease-out), box-shadow var(--fast) ease;
  user-select: none;
}
.btn:active { transform: scale(0.97); }
.btn-sm { height: 28px; padding: 0 12px; font-size: 12px; }
.btn-xs { height: 24px; padding: 0 8px; font-size: 12px; }
.btn-lg { height: 46px; padding: 0 24px; font-size: 14px; }
.btn-block { width: 100%; }
.btn-primary { background: var(--primary); color: #0a0a0d; }
.btn-primary:hover { background: #a3a7ff; }
.btn-secondary { background: var(--surface-3); color: var(--text); }
.btn-secondary:hover { background: #303030; }
.btn-glass { background: var(--glass); box-shadow: inset 0 1px 0 0 var(--glass-glow); color: var(--text); }
.btn-glass:hover { background: var(--glass-hover); }
.btn-ghost { color: var(--text-3); }
.btn-ghost:hover { background: rgb(255 255 255 / 0.06); color: #fff; }
.btn-buy { background: color-mix(in srgb, var(--buy) 26%, rgb(20 20 20 / 0.72)); color: var(--buy-light); box-shadow: inset 0 1px 0 0 var(--glass-glow); }
.btn-buy:hover { background: color-mix(in srgb, var(--buy) 34%, rgb(20 20 20 / 0.72)); }
.btn-sell { background: color-mix(in srgb, var(--sell-cta) 26%, rgb(20 20 20 / 0.72)); color: var(--sell-cta); box-shadow: inset 0 1px 0 0 var(--glass-glow); }
.btn-sell:hover { background: color-mix(in srgb, var(--sell-cta) 34%, rgb(20 20 20 / 0.72)); }
.btn-danger { background: color-mix(in srgb, var(--error) 60%, transparent); color: #fff; }
.btn[aria-disabled="true"], .btn:disabled { opacity: 0.45; pointer-events: none; }
.link { color: var(--primary); font-weight: 500; }
.link:hover { color: var(--primary-subtle); text-decoration: underline; text-underline-offset: 3px; }

/* ---------- panels ---------- */
.panel { background: var(--glass-subtle); box-shadow: var(--rim); border-radius: var(--r-lg); padding: 16px; }
.panel-tight { padding: 12px; }
.panel-flush { padding: 0; overflow: hidden; }
.panel-deep { background: rgb(10 10 10 / 0.45); box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.05); border-radius: var(--r-md); padding: 12px; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--glass-sep); }
.panel-title { font-size: 14px; font-weight: 600; }
.section-title { font-size: 15px; line-height: 20px; font-weight: 600; }

/* ---------- pills, badges ---------- */
.pill {
  height: 24px; padding: 0 10px; display: inline-flex; align-items: center; gap: 6px;
  border-radius: var(--r-full); font-size: 12px; font-weight: 600; white-space: nowrap;
  background: var(--glass); box-shadow: inset 0 1px 0 0 var(--glass-glow); color: var(--text-3);
}
.pill-primary { background: var(--primary-15); color: var(--primary); }
.pill-up { background: var(--buy-20); color: var(--buy-light); }
.pill-down { background: var(--sell-20); color: #ff6b6e; }
.pill-warn { background: var(--warning-20); color: var(--warning-strong); }
.pill-info { background: rgb(25 175 254 / 0.16); color: var(--info); }
.pill-gold { background: rgb(232 177 12 / 0.14); color: var(--gold); }
.dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }

/* ---------- segmented control & tabs ---------- */
.seg { display: inline-flex; height: 28px; padding: 2px; border-radius: var(--r-full); background: rgb(255 255 255 / 0.06); box-shadow: inset 0 1px 0 0 rgb(255 255 255 / 0.12); }
.seg a, .seg span { height: 24px; padding: 0 10px; display: inline-flex; align-items: center; border-radius: var(--r-full); font-size: 11px; font-weight: 600; color: var(--label); }
.seg [aria-current="true"] { background: var(--primary-35); color: #fff; box-shadow: inset 0 1px 0 0 rgb(255 255 255 / 0.15); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--glass-sep); }
.tab { padding: 10px 12px 9px; font-size: 13px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tab:hover { color: var(--text-2); }
.tab[aria-current="true"] { color: #fff; border-color: #fff; }
.tab .count { color: var(--muted); font-weight: 500; margin-left: 4px; }

/* ---------- stats ---------- */
.stat { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat .k { font-size: 12px; line-height: 16px; color: var(--label); white-space: nowrap; }
.stat .v { font-size: 14px; line-height: 20px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat .v-lg { font-size: 20px; line-height: 26px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.kv { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; line-height: 22px; }
.kv .k { color: var(--muted); }
.kv .v { font-weight: 500; font-variant-numeric: tabular-nums; text-align: right; }

/* ---------- rule meter: the product's instrument ---------- */
.meter { display: flex; flex-direction: column; gap: 8px; }
.meter-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.meter-name { font-size: 13px; font-weight: 600; }
.meter-val { font-size: 13px; font-variant-numeric: tabular-nums; color: var(--text-3); }
.meter-val b { color: #fff; font-weight: 600; }
.meter-track { position: relative; height: 6px; border-radius: 6px; background: rgb(255 255 255 / 0.07); }
.meter-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: inherit; background: #cfcfd4; transform-origin: left; animation: meter-in 700ms var(--ease-out) both; }
.meter-fill.ok { background: var(--buy); }
.meter-fill.caution { background: var(--warning); }
.meter-fill.danger { background: var(--sell); }
.meter-fill.neutral { background: #8a8a8a; }
.meter-mark { position: absolute; top: -4px; bottom: -4px; width: 2px; border-radius: 2px; background: #fff; opacity: 0.85; }
.meter-foot { display: flex; justify-content: space-between; font-size: 11px; line-height: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
@keyframes meter-in { from { transform: scaleX(0); } to { transform: scaleX(1); } }

/* ---------- checklist ---------- */
.check { display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; align-items: center; padding: 14px 16px; }
.check + .check { border-top: 1px solid var(--glass-sep); }
.check-ico { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: rgb(255 255 255 / 0.06); color: var(--muted); }
.check.done .check-ico { background: var(--buy-20); color: var(--buy-light); }
.check-title { font-weight: 600; }
.check-sub { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* ---------- tables ---------- */
.table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table th { text-align: left; font-weight: 500; font-size: 12px; color: var(--muted); padding: 8px 12px; white-space: nowrap; border-bottom: 1px solid var(--glass-sep); }
.table td { padding: 10px 12px; font-variant-numeric: tabular-nums; white-space: nowrap; border-bottom: 1px solid rgb(255 255 255 / 0.045); }
.table tr:last-child td { border-bottom: 0; }
.table .r { text-align: right; }
.table tbody tr { transition: background-color var(--fast) ease; }
.table tbody tr:hover { background: rgb(255 255 255 / 0.03); }
.table tr.me { background: var(--primary-15); }
.table tr.me:hover { background: rgb(144 149 253 / 0.2); }
.table tr.below td { opacity: 0.45; }
.table tr.cut td { padding: 0; height: 0; border: 0; }
.cut-line { position: relative; height: 26px; display: flex; align-items: center; gap: 10px; padding: 0 12px; font-size: 11px; font-weight: 600; color: var(--buy-light); }
.cut-line::before, .cut-line::after { content: ""; height: 1px; flex: 1; background: rgb(0 165 102 / 0.45); }
.rank { font-weight: 700; font-variant-numeric: tabular-nums; }
.rank.g { color: var(--gold); } .rank.s { color: var(--silver); } .rank.b { color: var(--bronze); }
.trader { display: flex; align-items: center; gap: 10px; }
.trader .avatar { width: 24px; height: 24px; font-size: 11px; }
.band { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: var(--r-xs); font-size: 11px; font-weight: 700; background: rgb(255 255 255 / 0.06); color: var(--text-3); font-variant-numeric: tabular-nums; }
.band-200 { background: rgb(232 177 12 / 0.14); color: var(--gold); }
.band-100 { background: rgb(192 192 200 / 0.12); color: var(--silver); }
.band-50 { background: rgb(205 127 50 / 0.14); color: #e09a55; }
.band-25 { background: rgb(160 200 230 / 0.12); color: #a9cde6; }
.band-5 { background: rgb(255 255 255 / 0.07); color: var(--text-3); }
.you { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: var(--r-xs); background: var(--primary); color: #0a0a0d; letter-spacing: 0.04em; }

/* ---------- banners ---------- */
.banner { display: flex; align-items: flex-start; gap: 12px; padding: 12px 16px; border-radius: var(--r-lg); box-shadow: var(--rim); background: var(--glass-subtle); }
.banner .ico { margin-top: 2px; }
.banner-title { font-weight: 600; }
.banner-body { color: var(--text-3); font-size: 13px; }
.banner.warn { background: linear-gradient(0deg, var(--warning-20), var(--warning-20)), rgb(10 10 10 / 0.4); }
.banner.warn .ico { color: var(--warning-strong); }
.banner.danger { background: linear-gradient(0deg, var(--sell-20), var(--sell-20)), rgb(10 10 10 / 0.4); }
.banner.danger .ico { color: #ff6b6e; }
.banner.info { background: linear-gradient(0deg, rgb(25 175 254 / 0.12), rgb(25 175 254 / 0.12)), rgb(10 10 10 / 0.4); }
.banner.info .ico { color: var(--info); }
.banner.good { background: linear-gradient(0deg, var(--buy-20), var(--buy-20)), rgb(10 10 10 / 0.4); }
.banner.good .ico { color: var(--buy-light); }
.banner.brand { background: linear-gradient(0deg, var(--primary-15), var(--primary-15)), rgb(10 10 10 / 0.4); }
.banner.brand .ico { color: var(--primary); }

/* ---------- modal (static open state) ---------- */
.scrim { position: fixed; inset: 0; z-index: 50; background: rgb(0 0 0 / 0.6); display: grid; place-items: center; padding: 24px; animation: fade-in 200ms var(--ease-out) both; }
.modal {
  width: 100%; max-width: 440px; max-height: calc(100dvh - 48px); overflow: auto;
  background: rgb(20 20 20 / 0.92); backdrop-filter: blur(14px) saturate(150%); -webkit-backdrop-filter: blur(14px) saturate(150%);
  border-radius: var(--r-2xl); box-shadow: var(--shadow-pop);
  animation: pop-in 220ms var(--ease-out) both;
}
.modal-wide { max-width: 560px; }
.modal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 20px 20px 0; }
.modal-title { font-size: 16px; line-height: 22px; font-weight: 600; }
.modal-body { padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 16px; }
.modal-foot { padding: 0 20px 20px; display: flex; gap: 8px; }
.under { filter: blur(2px) saturate(0.8); pointer-events: none; user-select: none; }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop-in { from { opacity: 0; transform: scale(0.96) translateY(4px); } to { opacity: 1; transform: none; } }

/* option cards (radio-like) */
.opt { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--r-xl); background: var(--glass-subtle); box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.08); transition: background-color var(--fast) ease, box-shadow var(--fast) ease; }
.opt:hover { background: var(--glass); }
.opt[aria-checked="true"] { background: var(--primary-15); box-shadow: inset 0 0 0 1px rgb(144 149 253 / 0.6); }
.radio { width: 16px; height: 16px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px #5c5c5c; flex: none; }
.opt[aria-checked="true"] .radio { box-shadow: inset 0 0 0 4.5px var(--primary); }
.checkbox { width: 16px; height: 16px; border-radius: 4px; box-shadow: inset 0 0 0 1.5px #5c5c5c; flex: none; display: grid; place-items: center; }
.checkbox[aria-checked="true"] { background: var(--primary); box-shadow: none; color: #0a0a0d; }

/* inputs */
.field { display: flex; flex-direction: column; gap: 6px; }
.field-label { font-size: 12px; color: var(--label); }
.input { height: 40px; padding: 0 12px; display: flex; align-items: center; gap: 8px; border-radius: var(--r-md); background: rgb(255 255 255 / 0.05); box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.08); font-variant-numeric: tabular-nums; }
.input:focus-within { box-shadow: inset 0 0 0 1px var(--primary); }
.input input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 14px; }
.input .unit { color: var(--muted); font-size: 13px; }
.input-sm { height: 34px; font-size: 13px; }
.help { font-size: 12px; color: var(--muted); }
.error-text { font-size: 12px; color: #ff6b6e; }

/* kbd */
.kbd { font-family: var(--mono); font-size: 11px; line-height: 16px; padding: 0 5px; border-radius: 4px; background: rgb(255 255 255 / 0.08); box-shadow: inset 0 -1px 0 rgb(255 255 255 / 0.08); color: var(--text-3); }

/* toast (static) */
.toast { position: fixed; z-index: 60; bottom: 72px; right: 24px; display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-radius: var(--r-full); background: rgb(20 20 20 / 0.9); backdrop-filter: blur(14px); box-shadow: 0 8px 40px rgb(0 0 0 / 0.2), inset 0 1px 0 0 var(--glass-glow), inset 0 0 0 1px var(--glass-edge); font-size: 13px; animation: toast-in 300ms var(--ease-out) both; }
@keyframes toast-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

/* ---------- terminal ---------- */
.term { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 8px; padding: 8px 16px 16px; align-items: start; }
.term-main { display: grid; grid-template-columns: minmax(0, 1fr) 260px; grid-template-rows: auto 440px auto; align-content: start; gap: 8px; min-width: 0; }
.term-main > .mkt-head { grid-column: 1 / -1; }
.term-main > .bottom { grid-column: 1 / -1; }
.term-side { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.mkt-head { display: flex; align-items: center; gap: 24px; padding: 8px 16px; min-height: 55px; overflow: hidden; }
.mkt-sym { display: flex; align-items: center; gap: 10px; padding-right: 16px; border-right: 1px solid var(--glass-sep); }
.coin { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 700; color: #111; flex: none; }
.mkt-head .stat .k { font-size: 10px; line-height: 12px; }
.mkt-head .stat .v { font-size: 12px; line-height: 16px; }
.chart-panel { padding: 0; overflow: hidden; display: flex; flex-direction: column; }
.chart-tools { display: flex; align-items: center; gap: 4px; padding: 6px 10px; border-bottom: 1px solid var(--glass-sep); font-size: 12px; color: var(--muted); }
.chart-tools .tf { padding: 2px 6px; border-radius: 4px; }
.chart-tools .tf[aria-current="true"] { color: #fff; background: rgb(255 255 255 / 0.08); }
.chart-svg { flex: 1; min-height: 0; }
.chart-svg svg { width: 100%; height: 100%; }
.book { padding: 0; overflow: hidden; font-size: 12px; display: flex; flex-direction: column; }
.book-row { display: grid; grid-template-columns: 1fr 1fr 1fr; padding: 0 10px; height: 19px; align-items: center; position: relative; font-variant-numeric: tabular-nums; }
.book-row span:nth-child(2), .book-row span:nth-child(3) { text-align: right; }
.book-row i { position: absolute; right: 0; top: 1px; bottom: 1px; opacity: 0.16; }
.book-row.ask span:first-child { color: var(--sell); } .book-row.ask i { background: var(--sell); }
.book-row.bid span:first-child { color: var(--buy); } .book-row.bid i { background: var(--buy); }
.book-mid { display: flex; justify-content: space-between; padding: 6px 10px; border-top: 1px solid var(--glass-sep); border-bottom: 1px solid var(--glass-sep); font-size: 12px; }
.bottom { padding: 0; overflow: hidden; }
.ticket { display: flex; flex-direction: column; gap: 12px; }
.side-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 3px; border-radius: var(--r-full); background: rgb(255 255 255 / 0.05); }
.side-toggle a { height: 32px; display: grid; place-items: center; border-radius: var(--r-full); font-weight: 600; font-size: 13px; color: var(--muted); }
.side-toggle .on-buy { background: color-mix(in srgb, var(--buy) 26%, rgb(20 20 20 / 0.72)); color: var(--buy-light); box-shadow: inset 0 1px 0 0 var(--glass-glow); }
.side-toggle .on-sell { background: color-mix(in srgb, var(--sell-cta) 26%, rgb(20 20 20 / 0.72)); color: var(--sell-cta); box-shadow: inset 0 1px 0 0 var(--glass-glow); }
.order-types { display: flex; gap: 14px; font-size: 13px; font-weight: 600; color: var(--muted); }
.order-types [aria-current="true"] { color: #fff; }
.slider { position: relative; height: 18px; display: flex; align-items: center; }
.slider::before { content: ""; position: absolute; left: 0; right: 0; height: 4px; border-radius: 4px; background: rgb(255 255 255 / 0.08); }
.slider .fill { position: absolute; left: 0; height: 4px; border-radius: 4px; background: #cfcfd4; }
.slider .knob { position: absolute; width: 14px; height: 14px; border-radius: 50%; background: #fff; transform: translateX(-50%); box-shadow: 0 1px 4px rgb(0 0 0 / 0.5); }
.slider .tick { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: #3a3a3a; transform: translateX(-50%); }

/* ---------- mockup navigation (not part of the product) ---------- */
.mockbar {
  position: fixed; z-index: 70; left: 50%; bottom: 16px; transform: translateX(-50%);
  display: flex; align-items: center; gap: 4px; padding: 4px; border-radius: var(--r-full);
  background: #f2f2f2; color: #111; font-size: 12px; font-weight: 500;
  box-shadow: 0 6px 24px rgb(0 0 0 / 0.5);
  max-width: calc(100vw - 32px);
}
.mockbar a, .mockbar span { height: 28px; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; border-radius: var(--r-full); white-space: nowrap; }
.mockbar a:hover { background: #dedede; }
.mockbar .mb-tag { background: #111; color: #f2f2f2; font-weight: 700; }
.mockbar .mb-flow { color: #555; }
.mockbar .ico { width: 14px; height: 14px; }
.mockbar [aria-disabled="true"] { opacity: 0.3; pointer-events: none; }
.mockbar .mb-next { background: #111; color: #f2f2f2; font-weight: 700; margin-left: 4px; }
.mockbar .mb-next:hover { background: #333; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-delay: 0ms !important; transition-duration: 1ms !important; }
}

/* header fits 1280 even with a long season chip */
.app-header > .row { min-width: 0; flex-shrink: 1; }
.header-right { flex-shrink: 0; }
.season-chip > span:nth-child(2) { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (max-width: 1360px) { .season-chip .bar { display: none; } .nav-item { padding: 0 9px; } }

/* ===================== shared components promoted from pages (round 4) ===================== */

/* timeline: neutral; .now marks the trader's own position in time */
.timeline { display: flex; flex-direction: column; gap: 14px; }
.timeline li { display: grid; grid-template-columns: 14px 1fr; gap: 12px; position: relative; }
.timeline li > div { display: flex; flex-direction: column; gap: 2px; font-size: 13px; }
.timeline li:not(:last-child)::after { content: ""; position: absolute; left: 6px; top: 16px; bottom: -14px; width: 2px; background: rgb(255 255 255 / 0.08); }
.timeline li.done::after { background: rgb(255 255 255 / 0.3); }
.tl-dot { width: 14px; height: 14px; border-radius: 50%; margin-top: 2px; box-shadow: inset 0 0 0 2px #3a3a3a; background: #0b0b0b; }
.timeline .done .tl-dot { background: #8a8a8a; box-shadow: none; }
.timeline .now .tl-dot { box-shadow: inset 0 0 0 2px var(--primary), 0 0 0 4px var(--primary-15); }

/* seat zones ladder: segments sized by seats; .is-you carries the own marker */
.ladder { display: flex; gap: 3px; }
.ladder-seg { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding-top: 10px; border-top: 3px solid rgb(255 255 255 / 0.16); min-width: 64px; flex-basis: 0; flex-shrink: 1; }
.ladder-seg .band, .ladder-seg .label { white-space: nowrap; }
.ladder-seg.is-you { border-color: var(--primary); }
.ladder-seg.is-out { border-color: rgb(255 255 255 / 0.05); border-top-style: dashed; }
.ladder-you { position: absolute; top: -8px; width: 13px; height: 13px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 3px var(--primary), 0 0 0 7px var(--primary-15); transform: translateX(-50%); }

/* pass row: a floor or minimum already met, smaller than a meter */
.pass-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 32px; font-size: 13px; }
.pass-row .k { display: inline-flex; align-items: center; gap: 8px; color: var(--text-2); }
.pass-row .k .ico { color: var(--buy-light); }
.pass-row .v { font-variant-numeric: tabular-nums; color: var(--text-3); }

/* ledger: settlement or payout receipt with a total row */
.ledger { display: flex; flex-direction: column; border-radius: var(--r-md); background: rgb(10 10 10 / 0.45); box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.05); padding: 4px 14px; }
.ledger .kv { line-height: 34px; border-bottom: 1px solid rgb(255 255 255 / 0.05); }
.ledger .kv:last-child { border-bottom: 0; }
.ledger .kv.total { font-weight: 600; font-size: 14px; }
.ledger .kv.total .k { color: var(--text); }

/* switch (selection control, violet when on) */
.switch { width: 32px; height: 18px; border-radius: 18px; background: rgb(255 255 255 / 0.14); position: relative; flex: none; transition: background-color var(--fast) ease; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform 200ms var(--ease-out); }
.switch[aria-checked="true"] { background: var(--primary); }
.switch[aria-checked="true"]::after { transform: translateX(14px); }

/* stepper: multi step process with done, current and pending */
.stepper { display: flex; flex-direction: column; gap: 2px; }
.step-row { display: grid; grid-template-columns: 24px 1fr auto; gap: 12px; align-items: start; padding: 10px 0; }
.step-ico { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; background: rgb(255 255 255 / 0.06); color: var(--muted); }
.step-row.done .step-ico { background: var(--buy-20); color: var(--buy-light); }
.step-row.now .step-ico { background: #fff; color: #0a0a0d; }
.step-row.pending { opacity: 0.6; }

/* right side drawer (static open), for detail over a list */
.drawer-scrim { position: fixed; inset: 0; z-index: 50; background: rgb(0 0 0 / 0.5); animation: fade-in 200ms var(--ease-out) both; }
.drawer { position: fixed; z-index: 51; top: 0; right: 0; bottom: 0; width: 480px; max-width: 100vw; overflow: auto; background: rgb(18 18 18 / 0.96); backdrop-filter: blur(14px); box-shadow: -8px 0 40px rgb(0 0 0 / 0.4), inset 1px 0 0 var(--glass-edge); animation: drawer-in 260ms var(--ease-out) both; }
@keyframes drawer-in { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }

/* empty state that teaches what will appear */
.empty { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 20px; border-radius: var(--r-lg); border: 1px dashed rgb(255 255 255 / 0.12); color: var(--text-3); font-size: 13px; }
.empty .ico { color: var(--muted); }

/* popover anchored to a trigger (static open) */
.popover { position: absolute; z-index: 40; min-width: 240px; padding: 6px; border-radius: var(--r-xl); background: rgb(22 22 22 / 0.96); backdrop-filter: blur(14px); box-shadow: var(--shadow-pop); transform-origin: top left; animation: pop-in 180ms var(--ease-out) both; }

/* tooltip (static open) */
.tip { position: absolute; z-index: 45; max-width: 260px; padding: 8px 10px; border-radius: var(--r-md); background: #0b0b0b; box-shadow: inset 0 0 0 1px var(--glass-edge), 0 8px 24px rgb(0 0 0 / 0.4); font-size: 12px; line-height: 16px; color: var(--text-2); }

/* segmented progress (n of m discrete steps, e.g. trading days) */
.segs { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; }
.segs i { height: 6px; border-radius: 2px; background: rgb(255 255 255 / 0.08); }
.segs i.on { background: #cfcfd4; }
.segs i.today { background: #fff; box-shadow: 0 0 0 2px var(--primary-35); }

/* mockup note: explains a state jump for the reviewer, never product UI */
.mock-note { padding: 12px 16px; border: 1px dashed rgb(255 255 255 / 0.22); border-radius: var(--r-lg); display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--text-3); }
.mock-tag { align-self: flex-start; font-family: var(--mono); font-size: 10px; letter-spacing: 0.04em; padding: 1px 6px; border-radius: 4px; background: #f2f2f2; color: #111; }
</style>
</head>
<body>
<div id="app"></div>
<a id="home" href="#/index">All flows</a>
<style>#home{position:fixed;z-index:80;left:16px;bottom:16px;height:32px;padding:0 14px;display:inline-flex;align-items:center;border-radius:9999px;background:#f2f2f2;color:#111;font-size:12px;font-weight:600;box-shadow:0 6px 24px rgb(0 0 0 / .5)}</style>
<script id="pages" type="application/json">__PAGES__</script>
<script>
(function () {
  var pages = JSON.parse(document.getElementById('pages').textContent);
  var app = document.getElementById('app');
  function show() {
    var h = location.hash;
    if (h && h.indexOf('#/') !== 0) return; // in-page anchors
    var route = h ? decodeURIComponent(h.slice(2)) : 'index';
    var p = pages[route] || pages['index'];
    app.innerHTML = p.body;
    document.getElementById('home').style.display = route === 'index' ? 'none' : '';
    document.title = p.title;
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', show);
  show();
})();
</script>
</body>
</html>
