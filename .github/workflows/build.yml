name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node build.mjs
      - run: node --test tests/*.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: funded-onchain-mockups
          path: |
            funded-onchain-mockups.html
            dist/
